spring:
  datasource:
    url: jdbc:h2:mem:execdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  aws:
    region: us-east-1
    endpoint: ""
  sqs:
    execution-url: http://test/execution
    os-updates-url: http://test/os-updates
  dynamodb:
    fila-table: test-fila
  jwt:
    secret: test-secret-test-secret-test-secret-xx

springdoc:
  swagger-ui:
    enabled: false
