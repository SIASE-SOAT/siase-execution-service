apiVersion: apps/v1
kind: Deployment
metadata:
  name: siase-execution-service
  labels:
    app: siase-execution-service
spec:
  type: LoadBalancer
  replicas: 2
  selector:
    matchLabels:
      app: siase-execution-service
  template:
    metadata:
      labels:
        app: siase-execution-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: siase-execution-service
          image: ECR_REGISTRY/IMAGE_NAME:IMAGE_TAG
          ports:
            - containerPort: 8083
          envFrom:
            - secretRef:
                name: siase-aws-creds
          env:
            - name: ENVIRONMENT
              value: "prod"
            - name: DB_HOST
              valueFrom: { secretKeyRef: { name: siase-execution-service-db, key: host } }
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: siase_exec_db
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: siase-execution-service-db, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: siase-execution-service-db, key: password } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: siase-jwt, key: secret } }
            - name: AWS_REGION
              value: us-east-1
            - name: SQS_BILLING_URL
              valueFrom: { configMapKeyRef: { name: siase-sqs-queues, key: billing-url } }
            - name: SQS_EXECUTION_URL
              valueFrom: { configMapKeyRef: { name: siase-sqs-queues, key: execution-url } }
            - name: SQS_OS_EVENTOS_URL
              valueFrom: { configMapKeyRef: { name: siase-sqs-queues, key: os-eventos-url } }
            - name: SQS_OS_UPDATES_URL
              valueFrom: { configMapKeyRef: { name: siase-sqs-queues, key: os-updates-url } }
            - name: DYNAMODB_FILA_TABLE
              valueFrom: { configMapKeyRef: { name: siase-dynamodb-tables, key: execution-fila } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            initialDelaySeconds: 15
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            initialDelaySeconds: 60
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: siase-execution-service
spec:
  type: LoadBalancer
  selector:
    app: siase-execution-service
  ports:
    - port: 80
      targetPort: 8083
